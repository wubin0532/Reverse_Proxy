name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: frontend build and component tests
        run: cd web && npm ci && npm test && npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - name: dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: amd64, suffix: x86_64 }
          - { goarch: arm64, suffix: arm64 }
          - { goarch: arm, suffix: armv7, goarm: "7" }
          - { goarch: mipsle, suffix: mipsle, gomips: softfloat }
          - { goarch: mips, suffix: mips, gomips: softfloat }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build web assets
        run: |
          cd web && npm ci && npm run build
      - name: build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          go build -tags adminweb -ldflags "-s -w -X main.version=$VERSION" \
            -o andey-proxy_${VERSION}_linux_${{ matrix.suffix }} .
      - uses: actions/upload-artifact@v4
        with:
          name: andey-proxy_linux_${{ matrix.suffix }}
          path: andey-proxy_*_linux_*

  signed-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web assets
        run: cd web && npm ci && npm run build
      - name: prepare protected signing key
        env:
          SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY_PEM"
          umask 077
          printf '%s' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/release-signing.pem"
      - name: build signed manual-update packages
        env:
          RELEASE_SIGNING_KEY: ${{ runner.temp }}/release-signing.pem
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./scripts/build-release.sh
      - name: verify checksums and all signed packages
        run: |
          (cd release && sha256sum -c checksums.txt)
          for spec in x86_64:amd64 arm64:arm64 armv7:arm mips:mips mipsle:mipsle; do
            suffix="${spec%%:*}"
            arch="${spec##*:}"
            ANDEY_SIGNED_RUN="$PWD/release/andey-proxy_${GITHUB_REF_NAME#v}_linux_${suffix}.run" \
              ANDEY_SIGNED_ARCH="$arch" \
              go test ./internal/upgrade -run '^TestBuiltSignedPackage$' -count=1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: andey-proxy_${{ github.ref_name }}_signed-packages
          path: release/
          if-no-files-found: error
